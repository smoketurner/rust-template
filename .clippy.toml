# Clippy tuning. See https://doc.rust-lang.org/clippy/configuration.html
# Lint levels themselves live in [workspace.lints.clippy] in Cargo.toml.

# Pre-1.0 workspace: changing the exported API is fine.
avoid-breaking-exported-api = false

# Complexity ceilings.
cognitive-complexity-threshold = 30
too-many-lines-threshold       = 100

# Short names that are acceptable below the min-chars threshold.
allowed-idents-below-min-chars = ["x", "y", "z", "i", "j", "k", "n", "s", "e", "id", "db", "tx", "rx", "ok"]

# Items from our own crates are brought in with `use`, not spelled inline as
# `crate::db::store::UserStore` or `my_common::config::Config`: import the type,
# trait, or const directly, and import a function's parent module
# (`use crate::db;` then `db::connect(..)`). `clippy::absolute_paths` flags any
# path of more than two segments rooted at a crate; every external crate is
# listed below so the lint reports only `crate::` and own-crate paths. The lint
# is denied in `[workspace.lints.clippy]`; a dependency added to
# `[workspace.dependencies]` belongs in this list too.
absolute-paths-max-segments = 2
absolute-paths-allowed-crates = [
    "std",
    "core",
    "alloc",
    "proc_macro",
    "anyhow",
    "askama",
    "aws_config",
    "aws_credential_types",
    "aws_lc_rs",
    "aws_sdk_dsql",
    "axum",
    "axum_extra",
    "axum_server",
    "base64",
    "clap",
    "fluent_bundle",
    "i18n_embed",
    "i18n_embed_fl",
    "jiff",
    "mime_guess",
    "proptest",
    "rust_embed",
    "rustls",
    "sea_query",
    "sea_query_sqlx",
    "secrecy",
    "serde",
    "serde_json",
    "sqlx",
    "thiserror",
    "tokio",
    "tokio_rustls",
    "tokio_util",
    "tower",
    "tower_governor",
    "tower_http",
    "tracing",
    "tracing_subscriber",
    "unic_langid",
    "uuid",
    "webpki_roots",
]

# MSRV is read automatically from the workspace `rust-version` field.

# Conventions from CLAUDE.md, enforced. Add project-specific bans here (e.g. a
# clock read that must go through a per-request timestamp) with a reason that
# names the sanctioned alternative; opt out with `#[expect(clippy::disallowed_methods, reason = "...")]`.
disallowed-methods = [
    { path = "uuid::Uuid::new_v4", reason = "IDs are UUID v7: use `Uuid::now_v7()`" },
    { path = "std::time::SystemTime::now", reason = "date/time goes through jiff: use `jiff::Timestamp::now()`" },
]
